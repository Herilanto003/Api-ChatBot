[project]
name = "chatbot-api"
version = "0.1.0"
description = "API de chatbot (FastAPI + SQLAlchemy 2 async + PostgreSQL + Alembic)"
requires-python = ">=3.11"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py311"
line-length = 100
# `.agents` contient des skills tiers (documentation) : hors périmètre du lint.
extend-exclude = [".agents", ".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
